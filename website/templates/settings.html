<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        h1 {
            text-align: center;
            padding: 20px;
            margin: 0;
            background-color: #007BFF;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            position: relative;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            gap: 20px; 
            width: 80%;
        }

        .back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            font-size: 14px;
            background-color: #f4f4f4;
            color: #007BFF;
            border: 2px solid #007BFF;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .stop-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            font-size: 14px;
            background-color: #f4f4f4;
            color: #007BFF;
            border: 2px solid #007BFF;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        input {
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        #text_output {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
        .button_pressed {
            background-color: rgb(249, 196, 3);
        }
        .settings-button:hover {
            background-color: #00ff48;
            color: #ffffff;
        }

        .number-buttons-container {
            display: flex;
            gap: 10px;
        }
        .number-button {
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #007BFF;
            border-radius: 4px;
            background-color: #f4f4f4;
            color: #007BFF;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .number-button.pressed {
            background-color: #007BFF;
            color: white;
        }
    </style>
</head>
<body>
    <h1>
        Settings
        <!-- Settings Button -->
        <a href="/" class="back-button">Back</a>
        <a class="stop-button" onclick="stop_website()">Stop</a>
    </h1>
    <div class="container">
        <!-- Number Buttons -->
        <div class="number-buttons-container">
            <button class="number-button" id="button-1" onclick="toggleNumberButton('button-1')">1</button>
            <button class="number-button" id="button-2" onclick="toggleNumberButton('button-2')">2</button>
            <button class="number-button" id="button-3" onclick="toggleNumberButton('button-3')">3</button>
            <button class="number-button" id="button-4" onclick="toggleNumberButton('button-4')">4</button>
        </div>

        <button type="submit" id="button_measuring" onclick="measuring('button_measuring')">Start process</button>
        <input type="number" id="integer-input" placeholder="Enter the amount of liquid in ml" required>
        <button type="submit" onclick="calculate('integer-input')">Calculate timing</button>
        <br>
        <label id="text_output"></label>
    </div>

    <script>
        let blocked = false;

        function measuring(buttonID) {
            if(blocked) {
                return;
            }
            blocked = true;

            var button_measuring = document.getElementById(buttonID);
            button_measuring.classList.add('button_pressed');

            fetch('/settings/measuring', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({})
            })
            .then(response => response.json())
            .then(data => {
                blocked = false;
                button_measuring.classList.remove('button_pressed');
                console.log(data.message);  // Log the server response
            })
            .catch(error => {
                console.error('Error:', error);
            });

        }

        function calculate(inputID) {
            if(blocked) {
                return;
            }
            blocked = true;

            var amount = document.getElementById(inputID).value;

            fetch('/settings/calculate/' + encodeURIComponent(amount), {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({amount: amount})
            })
            .then(response => response.json())
            .then(data => {
                blocked = false;
                document.getElementById('text_output').innerHTML = "New TPM: " + data.tpm + "s";

                console.log(data.tpm);  // Log the server response
            })
            .catch(error => {
                console.error('Error:', error);
            });

        }

        function stop_website() {
            fetch('/settings/stop_website', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({})
            })
            .then(response => response.json())
            .catch(error => {
                console.error('Error:', error);
            });

        }

        function toggleNumberButton(buttonID) {
            const button = document.getElementById(buttonID);
            toggleFlow(button.innerText);
            button.classList.toggle('pressed');
        }

        let flowStates = {};
        function toggleFlow(input) {
            const currentState = flowStates[input] || false;
            const newState = currentState === false ? true : false;
            flowStates[input] = newState;
            console.log('newState:', newState);

            fetch('/settings/flow', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ input: input, value: newState })
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

    </script>
</body>
</html>
